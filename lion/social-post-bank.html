<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Publishing — Social Post Bank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --text: #eaeaea;
    --text-muted: #8892a4;
    --border: #2a2a4a;
    --green: #4ade80;
    --tag-short: #7c3aed;
    --tag-long: #2563eb;
    --tag-video: #dc2626;
    --tag-story: #ea580c;
    --tag-carousel: #0891b2;
    --tag-thread: #4f46e5;
    --tag-reel: #c026d3;
    --tag-podcast: #059669;
    --tag-blog: #b45309;
    --tag-text: #6b7280;
    --tag-image: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
    align-items: center;
  }

  .controls input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    min-width: 220px;
    flex: 1;
    max-width: 400px;
  }

  .filter-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
    align-items: center;
  }

  .filter-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-right: 0.25rem;
  }

  .toggle-done {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }

  .toggle-done input { accent-color: var(--accent); width: 16px; height: 16px; }

  .stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .stats span { font-weight: 600; color: var(--accent2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    transition: all 0.2s;
    position: relative;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card.done { opacity: 0.45; }
  .card.done .card-title { text-decoration: line-through; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }

  .card-check {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: transparent;
    color: transparent;
    font-size: 12px;
  }

  .card-check:hover { border-color: var(--green); }
  .card-check.checked { border-color: var(--green); background: var(--green); color: #000; }

  .card-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 0.75rem;
  }

  .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }

  .tag {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tag-short { background: var(--tag-short); color: #fff; }
  .tag-long { background: var(--tag-long); color: #fff; }
  .tag-video { background: var(--tag-video); color: #fff; }
  .tag-story { background: var(--tag-story); color: #fff; }
  .tag-carousel { background: var(--tag-carousel); color: #fff; }
  .tag-thread { background: var(--tag-thread); color: #fff; }
  .tag-reel { background: var(--tag-reel); color: #fff; }
  .tag-podcast { background: var(--tag-podcast); color: #fff; }
  .tag-blog { background: var(--tag-blog); color: #fff; }
  .tag-text { background: var(--tag-text); color: #fff; }
  .tag-image { background: var(--tag-image); color: #fff; }

  .card-category {
    font-size: 0.75rem;
    color: var(--accent2);
    font-weight: 500;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .source-badge {
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 8px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .source-notion { background: #2d2d2d; color: #e0e0e0; }
  .source-clanker { background: #1e3a5f; color: #7cb3e0; }

  .card-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .card-meta .talent { color: var(--green); }

  .card-links {
    margin-top: 0.5rem;
    font-size: 0.8rem;
  }

  .card-links a {
    color: var(--accent);
    text-decoration: none;
    display: inline-block;
    margin-right: 0.75rem;
  }

  .card-links a:hover { text-decoration: underline; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  .card-actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .push-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    margin-left: auto;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .push-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .push-btn.sent { background: var(--green); pointer-events: none; }

  .edit-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.72rem;
    transition: all 0.2s;
  }

  .edit-btn:hover { border-color: var(--accent); color: var(--text); }

  .edit-indicator {
    font-size: 0.65rem;
    color: var(--accent2);
    margin-left: auto;
    padding: 0.25rem 0.5rem;
    opacity: 0.7;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem;
    overflow-y: auto;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 640px;
    margin-top: 2rem;
  }

  .modal h3 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: var(--accent2);
  }

  .modal label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    margin-top: 0.8rem;
  }

  .modal textarea, .modal input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: inherit;
    resize: vertical;
  }

  .modal textarea { min-height: 100px; line-height: 1.5; }
  .modal textarea:focus, .modal input:focus { outline: none; border-color: var(--accent); }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.4rem;
  }

  .modal-tag {
    padding: 0.3rem 0.7rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.15s;
    user-select: none;
  }

  .modal-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-tag:hover { border-color: var(--accent); }

  .ref-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.4rem;
    align-items: center;
  }

  .ref-row input { flex: 1; }

  .ref-remove {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.2rem;
  }

  .add-ref-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    margin-top: 0.5rem;
  }

  .add-ref-btn:hover { border-color: var(--accent); color: var(--text); }

  .modal-footer {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
    justify-content: flex-end;
  }

  .modal-btn {
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .modal-btn-save { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-btn-save:hover { opacity: 0.9; }
  .modal-btn-cancel { background: var(--surface2); color: var(--text-muted); }
  .modal-btn-cancel:hover { color: var(--text); }
  .modal-btn-reset { background: none; color: var(--text-muted); border: none; font-size: 0.75rem; margin-right: auto; }
  .modal-btn-reset:hover { color: var(--accent); }

  @media (max-width: 500px) {
    body { padding: 1rem; }
    .grid { grid-template-columns: 1fr; }
    .modal { margin-top: 1rem; }
  }
</style>
</head>
<body>

<h1>🦁 Lion Publishing — Social Post Bank</h1>
<p class="subtitle">Content ideas for pre-BackerKit launch (Oct 5, 2026) and beyond — <span id="totalIdeas">0</span> ideas</p>

<div class="controls">
  <input type="text" id="search" placeholder="Search posts..." oninput="render()">
  <label class="toggle-done"><input type="checkbox" id="hideDone" onchange="render()"> Hide completed</label>
  <button class="push-btn" id="pushBtn" onclick="pushChanges()" style="display:none;">📤 Push Changes to Clanker</button>
</div>

<div class="filter-row">
  <span class="filter-label">Type:</span>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('type','all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('type','short', this)">Short Post</button>
  <button class="filter-btn" onclick="setFilter('type','long', this)">Long Post</button>
  <button class="filter-btn" onclick="setFilter('type','video', this)">Video</button>
  <button class="filter-btn" onclick="setFilter('type','reel', this)">Reel/TikTok</button>
  <button class="filter-btn" onclick="setFilter('type','carousel', this)">Carousel</button>
  <button class="filter-btn" onclick="setFilter('type','story', this)">Story</button>
  <button class="filter-btn" onclick="setFilter('type','thread', this)">Thread</button>
  <button class="filter-btn" onclick="setFilter('type','blog', this)">Blog</button>
  <button class="filter-btn" onclick="setFilter('type','image', this)">Image</button>
  <button class="filter-btn" onclick="setFilter('type','text', this)">Text</button>
  <button class="filter-btn" onclick="setFilter('type','podcast', this)">Podcast Clip</button>
</div>

<div class="filter-row">
  <span class="filter-label">Source:</span>
  <button class="filter-btn active" onclick="setFilter('source','all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('source','notion', this)">📋 Notion</button>
  <button class="filter-btn" onclick="setFilter('source','clanker', this)">🔧 Clanker</button>
</div>

<div class="filter-row">
  <span class="filter-label">Talent:</span>
  <button class="filter-btn active" onclick="setFilter('talent','all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('talent','Rebekah', this)">Rebekah</button>
  <button class="filter-btn" onclick="setFilter('talent','Seth', this)">Seth</button>
  <button class="filter-btn" onclick="setFilter('talent','Rachael', this)">Rachael</button>
  <button class="filter-btn" onclick="setFilter('talent','Nathan', this)">Nathan</button>
  <button class="filter-btn" onclick="setFilter('talent','Chelsea', this)">Chelsea</button>
  <button class="filter-btn" onclick="setFilter('talent','Hayla', this)">Hayla</button>
  <button class="filter-btn" onclick="setFilter('talent','Team', this)">Full Team</button>
</div>

<div class="stats">
  <div>Total: <span id="totalCount">0</span></div>
  <div>Showing: <span id="showCount">0</span></div>
  <div>Done: <span id="doneCount">0</span></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Edit Post</h3>

    <label>Title</label>
    <input type="text" id="editTitle">

    <label>Description</label>
    <textarea id="editDesc"></textarea>

    <label>Category</label>
    <input type="text" id="editCategory">

    <label>Post Types</label>
    <div class="modal-tags" id="editTypes"></div>

    <label>On-Camera Talent (comma-separated)</label>
    <input type="text" id="editTalent" placeholder="e.g. Rebekah, Seth">

    <label>Assigned To</label>
    <input type="text" id="editAssign" placeholder="e.g. Hayla">

    <label>Reference Links</label>
    <div id="editRefs"></div>
    <button class="add-ref-btn" onclick="addRefRow()">+ Add Reference</button>

    <div class="modal-footer">
      <button class="modal-btn modal-btn-reset" onclick="resetEdits()">Reset to Original</button>
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="saveEdits()">Save</button>
    </div>
  </div>
</div>

const ALL_TYPES = ['short','long','video','reel','carousel','story','thread','blog','image','text','podcast'];
const TAG_MAP = {
  short: 'Short Post', long: 'Long Post', video: 'Video', story: 'Story',
  carousel: 'Carousel', thread: 'Thread', reel: 'Reel/TikTok', podcast: 'Podcast Clip',
  blog: 'Blog', text: 'Text Post', image: 'Image'
};

let filters = { type: 'all', source: 'all', talent: 'all' };
let doneSet = new Set(JSON.parse(localStorage.getItem('lion_done_v2') || '[]'));
let edits = JSON.parse(localStorage.getItem('lion_edits_v1') || '{}');
let editingId = null;

function saveDone() { localStorage.setItem('lion_done_v2', JSON.stringify([...doneSet])); }
function saveEdits() {
  const id = editingId;
  if (!id) return;
  const p = POSTS.find(x => x.id === id);
  if (!p) return;

  const title = document.getElementById('editTitle').value.trim();
  const desc = document.getElementById('editDesc').value.trim();
  const category = document.getElementById('editCategory').value.trim();
  const types = [...document.querySelectorAll('#editTypes .modal-tag.selected')].map(t => t.dataset.type);
  const talent = document.getElementById('editTalent').value.split(',').map(s => s.trim()).filter(Boolean);
  const assign = document.getElementById('editAssign').value.trim();
  const refs = [];
  document.querySelectorAll('.ref-row').forEach(row => {
    const label = row.querySelector('.ref-label').value.trim();
    const url = row.querySelector('.ref-url').value.trim();
    if (label && url) refs.push({ label, url });
  });

  edits[id] = { title, desc, category, types, talent, assign, refs };
  localStorage.setItem('lion_edits_v1', JSON.stringify(edits));
  closeModal();
  render();
}

function getPost(p) {
  const e = edits[p.id];
  if (!e) return p;
  return { ...p, ...e };
}

function hasEdits(id) { return !!edits[id]; }

function openEdit(id) {
  editingId = id;
  const p = getPost(POSTS.find(x => x.id === id));
  document.getElementById('modalTitle').textContent = '✏️ Edit: ' + (p.title || '');
  document.getElementById('editTitle').value = p.title || '';
  document.getElementById('editDesc').value = p.desc || '';
  document.getElementById('editCategory').value = p.category || '';
  document.getElementById('editTalent').value = (p.talent || []).join(', ');
  document.getElementById('editAssign').value = p.assign || '';

  // Types
  const typesDiv = document.getElementById('editTypes');
  typesDiv.innerHTML = ALL_TYPES.map(t => {
    const sel = (p.types || []).includes(t) ? ' selected' : '';
    return `<span class="modal-tag${sel}" data-type="${t}" onclick="this.classList.toggle('selected')">${TAG_MAP[t] || t}</span>`;
  }).join('');

  // Refs
  const refsDiv = document.getElementById('editRefs');
  refsDiv.innerHTML = '';
  (p.refs || []).forEach(r => addRefRow(r.label, r.url));

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  editingId = null;
  document.getElementById('modalOverlay').classList.remove('open');
}

function resetEdits() {
  if (!editingId) return;
  delete edits[editingId];
  localStorage.setItem('lion_edits_v1', JSON.stringify(edits));
  closeModal();
  render();
}

function addRefRow(label, url) {
  const div = document.getElementById('editRefs');
  const row = document.createElement('div');
  row.className = 'ref-row';
  row.innerHTML = `
    <input type="text" class="ref-label" placeholder="Label" value="${label || ''}">
    <input type="text" class="ref-url" placeholder="https://..." value="${url || ''}">
    <button class="ref-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  div.appendChild(row);
}

function toggleDone(id) {
  if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
  saveDone();
  render();
}

function setFilter(group, value, btn) {
  filters[group] = value;
  btn.closest('.filter-row, .controls').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const hideDone = document.getElementById('hideDone').checked;
  const grid = document.getElementById('grid');

  let filtered = POSTS.map(getPost).filter(p => {
    if (filters.type !== 'all' && !p.types.includes(filters.type)) return false;
    if (filters.source !== 'all' && p.source !== filters.source) return false;
    if (filters.talent !== 'all') {
      if (filters.talent === 'Team') {
        if (p.talent.length < 3) return false;
      } else {
        if (!p.talent.includes(filters.talent)) return false;
      }
    }
    if (hideDone && doneSet.has(p.id)) return false;
    if (q && !(p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.assign && p.assign.toLowerCase().includes(q)) || p.talent.join(' ').toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = POSTS.length;
  document.getElementById('totalIdeas').textContent = POSTS.length;
  document.getElementById('showCount').textContent = filtered.length;
  document.getElementById('doneCount').textContent = doneSet.size;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No posts match your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const done = doneSet.has(p.id);
    const edited = hasEdits(p.id);
    const srcClass = p.source === 'notion' ? 'source-notion' : 'source-clanker';
    const srcLabel = p.source === 'notion' ? '📋 Notion' : '🔧 Clanker';
    const talentStr = p.talent.length ? p.talent.join(', ') : '';
    const assignStr = p.assign || '';

    return `
      <div class="card ${done ? 'done' : ''}">
        <div class="card-category">
          ${p.category}
          <span class="source-badge ${srcClass}">${srcLabel}</span>
        </div>
        <div class="card-header">
          <div class="card-title">${p.title}</div>
          <div class="card-check ${done ? 'checked' : ''}" onclick="toggleDone(${p.id})">${done ? '✓' : ''}</div>
        </div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.types.map(t => `<span class="tag tag-${t}">${TAG_MAP[t] || t}</span>`).join('')}</div>
        ${talentStr || assignStr ? `<div class="card-meta">${talentStr ? `<span>🎬 <span class="talent">${talentStr}</span></span>` : ''}${assignStr ? `<span>📌 ${assignStr}</span>` : ''}</div>` : ''}
        ${p.refs.length ? `<div class="card-links">${p.refs.map(r => `<a href="${r.url}" target="_blank">📎 ${r.label}</a>`).join('')}</div>` : ''}
        <div class="card-actions">
          <button class="edit-btn" onclick="openEdit(${p.id})">✏️ Edit</button>
          ${edited ? '<span class="edit-indicator">✦ edited</span>' : ''}
        </div>
      </div>`;
  }).join('');
}

// Keyboard shortcut: Escape closes modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Push changes button visibility
function updatePushBtn() {
  const btn = document.getElementById('pushBtn');
  const hasAnyEdits = Object.keys(edits).length > 0 || doneSet.size > 0;
  btn.style.display = hasAnyEdits ? '' : 'none';
}

// Push changes to Clanker via Discord
async function pushChanges() {
  const btn = document.getElementById('pushBtn');
  btn.textContent = '⏳ Preparing...';

  // Build change summary
  const lines = [];
  lines.push('**📤 Social Post Bank — Changes from Rebekah**\n');

  // Edits
  const editKeys = Object.keys(edits);
  if (editKeys.length) {
    lines.push(`**✏️ ${editKeys.length} post(s) edited:**`);
    editKeys.forEach(id => {
      const orig = POSTS.find(p => p.id === parseInt(id));
      const e = edits[id];
      if (!orig) return;
      lines.push(`\n> **#${id}: ${e.title || orig.title}**`);
      if (e.title && e.title !== orig.title) lines.push(`> Title: ~~${orig.title}~~ → ${e.title}`);
      if (e.desc && e.desc !== orig.desc) lines.push(`> Description updated`);
      if (e.category && e.category !== orig.category) lines.push(`> Category: ~~${orig.category}~~ → ${e.category}`);
      if (e.types && JSON.stringify(e.types) !== JSON.stringify(orig.types)) lines.push(`> Types: ${e.types.join(', ')}`);
      if (e.talent && JSON.stringify(e.talent) !== JSON.stringify(orig.talent)) lines.push(`> Talent: ${e.talent.join(', ') || '(none)'}`);
      if (e.assign !== undefined && e.assign !== orig.assign) lines.push(`> Assigned: ${e.assign || '(none)'}`);
      if (e.refs && JSON.stringify(e.refs) !== JSON.stringify(orig.refs)) {
        e.refs.forEach(r => lines.push(`> Ref: [${r.label}](${r.url})`));
      }
      if (e.desc && e.desc !== orig.desc) lines.push(`> New description: ${e.desc.substring(0, 300)}${e.desc.length > 300 ? '...' : ''}`);
    });
  }

  // Done items
  if (doneSet.size) {
    lines.push(`\n**✅ ${doneSet.size} post(s) marked done:**`);
    [...doneSet].forEach(id => {
      const p = POSTS.find(x => x.id === id);
      if (p) lines.push(`> #${id}: ${p.title}`);
    });
  }

  lines.push('\n`@Clanker please bake these into the source file.`');

  const message = lines.join('\n');

  // Copy to clipboard as fallback
  try { await navigator.clipboard.writeText(message); } catch(e) {}

  // Open Discord with pre-filled message to #lion channel
  // Discord doesn't support pre-filled messages easily, so we'll copy and prompt
  btn.textContent = '📋 Copied to clipboard!';
  btn.classList.add('sent');

  // Show toast + open Discord
  const note = document.createElement('div');
  note.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:1.25rem 2rem;z-index:999;text-align:center;font-size:0.9rem;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,0.5);';
  note.innerHTML = `
    <div style="font-weight:700;color:var(--accent2);margin-bottom:0.5rem;">📋 Changes copied to clipboard!</div>
    <div style="color:var(--text-muted);font-size:0.85rem;">Paste in <strong>#lion</strong> on Discord. Opening Discord now...</div>
    <div style="display:flex;gap:0.5rem;justify-content:center;margin-top:0.75rem;">
      <button onclick="this.closest('div[style]').parentElement.remove()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);padding:0.3rem 1rem;border-radius:6px;cursor:pointer;font-size:0.8rem;">Got it</button>
      <button onclick="clearAllEdits();this.closest('div[style]').parentElement.remove()" style="background:var(--accent);border:none;color:#fff;padding:0.3rem 1rem;border-radius:6px;cursor:pointer;font-size:0.8rem;font-weight:600;">✅ Clear All Local Edits</button>
    </div>
  `;
  document.body.appendChild(note);

  // Open Discord to the #lion channel
  setTimeout(() => {
    window.open('https://discord.com/channels/1471228175580397791/1471930842346553557', '_blank');
  }, 500);

  setTimeout(() => {
    btn.textContent = '📤 Push Changes to Clanker';
    btn.classList.remove('sent');
  }, 5000);
}

function clearAllEdits() {
  edits = {};
  localStorage.setItem('lion_edits_v1', '{}');
  render();
}

// Override render to also update push button
const _origRender = render;
render = function() { _origRender(); updatePushBtn(); };

render();
</script>
