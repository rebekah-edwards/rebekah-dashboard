<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Publishing — Social Post Bank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --text: #eaeaea;
    --text-muted: #8892a4;
    --border: #2a2a4a;
    --green: #4ade80;
    --tag-short: #7c3aed;
    --tag-long: #2563eb;
    --tag-video: #dc2626;
    --tag-story: #ea580c;
    --tag-carousel: #0891b2;
    --tag-thread: #4f46e5;
    --tag-reel: #c026d3;
    --tag-podcast: #059669;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  .controls input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    min-width: 220px;
    flex: 1;
    max-width: 400px;
  }

  .filter-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .toggle-done {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }

  .toggle-done input { accent-color: var(--accent); width: 16px; height: 16px; }

  .stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .stats span { font-weight: 600; color: var(--accent2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    transition: all 0.2s;
    position: relative;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card.done { opacity: 0.45; }
  .card.done .card-title { text-decoration: line-through; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-check {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: transparent;
    color: transparent;
    font-size: 12px;
  }

  .card-check:hover { border-color: var(--green); }
  .card-check.checked { border-color: var(--green); background: var(--green); color: #000; }

  .card-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 0.75rem;
  }

  .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }

  .tag {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tag-short { background: var(--tag-short); color: #fff; }
  .tag-long { background: var(--tag-long); color: #fff; }
  .tag-video { background: var(--tag-video); color: #fff; }
  .tag-story { background: var(--tag-story); color: #fff; }
  .tag-carousel { background: var(--tag-carousel); color: #fff; }
  .tag-thread { background: var(--tag-thread); color: #fff; }
  .tag-reel { background: var(--tag-reel); color: #fff; }
  .tag-podcast { background: var(--tag-podcast); color: #fff; }

  .card-category {
    font-size: 0.75rem;
    color: var(--accent2);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .card-links {
    margin-top: 0.5rem;
    font-size: 0.8rem;
  }

  .card-links a {
    color: var(--accent);
    text-decoration: none;
    display: inline-block;
    margin-right: 0.75rem;
  }

  .card-links a:hover { text-decoration: underline; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  @media (max-width: 500px) {
    body { padding: 1rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>🦁 Lion Publishing — Social Post Bank</h1>

<div class="controls">

  <button class="filter-btn" data-filter="short" onclick="setFilter('short', this)">Short Post</button>
  <button class="filter-btn" data-filter="long" onclick="setFilter('long', this)">Long Post</button>
  <button class="filter-btn" data-filter="video" onclick="setFilter('video', this)">Video</button>
  <button class="filter-btn" data-filter="reel" onclick="setFilter('reel', this)">Reel/TikTok</button>
  <button class="filter-btn" data-filter="carousel" onclick="setFilter('carousel', this)">Carousel</button>
  <button class="filter-btn" data-filter="story" onclick="setFilter('story', this)">Story</button>
  <button class="filter-btn" data-filter="thread" onclick="setFilter('thread', this)">Thread</button>
  <button class="filter-btn" data-filter="podcast" onclick="setFilter('podcast', this)">Podcast Clip</button>
  <label class="toggle-done"><input type="checkbox" id="hideDone" onchange="render()"> Hide completed</label>
</div>

<div class="stats">
  <div>Total: <span id="totalCount">0</span></div>
  <div>Showing: <span id="showCount">0</span></div>
  <div>Done: <span id="doneCount">0</span></div>
</div>

<div class="grid" id="grid"></div>

let currentFilter = 'all';
let doneSet = new Set(JSON.parse(localStorage.getItem('lion_done') || '[]'));

function saveDone() {
  localStorage.setItem('lion_done', JSON.stringify([...doneSet]));
}

function toggleDone(id) {
  if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
  saveDone();
  render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const hideDone = document.getElementById('hideDone').checked;
  const grid = document.getElementById('grid');

  let filtered = POSTS.filter(p => {
    if (currentFilter !== 'all' && !p.types.includes(currentFilter)) return false;
    if (hideDone && doneSet.has(p.id)) return false;
    if (q && !(p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.category.toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = POSTS.length;
  document.getElementById('showCount').textContent = filtered.length;
  document.getElementById('doneCount').textContent = doneSet.size;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No posts match your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const done = doneSet.has(p.id);
    const tagMap = {
      short: 'Short Post', long: 'Long Post', video: 'Video', story: 'Story',
      carousel: 'Carousel', thread: 'Thread', reel: 'Reel/TikTok', podcast: 'Podcast Clip'
    };
    return `
      <div class="card ${done ? 'done' : ''}">
        <div class="card-category">${p.category}</div>
        <div class="card-header">
          <div class="card-title">${p.title}</div>
          <div class="card-check ${done ? 'checked' : ''}" onclick="toggleDone(${p.id})">${done ? '✓' : ''}</div>
        </div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.types.map(t => `<span class="tag tag-${t}">${tagMap[t] || t}</span>`).join('')}</div>
        ${p.refs.length ? `<div class="card-links">${p.refs.map(r => `<a href="${r.url}" target="_blank">📎 ${r.label}</a>`).join('')}</div>` : ''}
      </div>`;
  }).join('');
}

render();
